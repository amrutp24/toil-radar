name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  metrics-format:
    # Validates the Prometheus export against promtool, so "it looks right"
    # never stands in for "a Prometheus parser accepts it".
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.14.0"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install promtool
      run: |
        curl -sSL -o prom.tar.gz \
          "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
        tar -xzf prom.tar.gz "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
        sudo mv "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/
        promtool --version
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest
    - name: Check exported metrics parse
      # -rs surfaces skips: if promtool went missing the test would skip
      # silently and this job would pass without checking anything.
      run: python -m pytest tests/ -k export -v -rs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # scan full history, not just the latest commit
    - uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest
        
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v
        
    - name: Test CLI installation
      run: |
        toil-radar --help
        toil-radar scan --help